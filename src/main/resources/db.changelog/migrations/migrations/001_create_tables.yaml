databaseChangeLog:
  - changeSet:
      id: 1
      author: dev
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: surname
                  type: text
              - column:
                  name: age
                  type: integer
              - column:
                  name: email
                  type: text
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: password
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: phone_number
                  type: varchar(55)
              - column:
                  name: avatar
                  type: text
              - column:
                  name: account_type
                  type: varchar(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: parent_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_category_parent
                    references: categories(id)
                    deleteCascade: false

        - createTable:
            tableName: vacancies
            columns:
              - column:
                  name: id
                  type: bigserial
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: category_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_vacancy_category
                    references: categories(id)
                    nullable: false
              - column:
                  name: salary
                  type: real
              - column:
                  name: exp_from
                  type: integer
              - column:
                  name: exp_to
                  type: integer
              - column:
                  name: is_active
                  type: boolean
                  defaultValue: true
              - column:
                  name: author_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_vacancy_author
                    references: users(id)
                    nullable: false
              - column:
                  name: created_date
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: update_time
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP

        # ... аналогично для остальных таблиц ...